<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoviEase Admin Dashboard</title>
  <link rel="stylesheet" href="../../../styles/AdminPage.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<style>
    /* ===== GENERAL STYLES ===== */
body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background-color: #fff;
  color: #333;
}

/* ===== NAVBAR ===== */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #a10000;
  color: #fff;
  padding: 10px 30px;
  position: fixed;
  width: 100%;
  top: 0;
  z-index: 1000;
  box-sizing: border-box;
}

.navbar-left {
  display: flex;
  align-items: center;
  gap: 15px;
  font-weight: bold;
  font-size: 1.2rem;
}

.navbar-left i {
  font-size: 1.3rem;
}

#toggleSidebar {
  background: none;
  border: none;
  color: #fff;
  font-size: 1.3rem;
  cursor: pointer;
}

.navbar-center {
  margin: 0;
  font-size: 1.1rem;
  letter-spacing: 0.5px;
  flex: 1;
  text-align: center;
}

.navbar-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

.profile-pic {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 2px solid #fff;
}

/* ===== MAIN CONTAINER ===== */
.container {
  display: flex;
  margin-top: 65px; /* space for fixed navbar */
  height: calc(100vh - 65px);
  transition: all 0.3s ease;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 280px;
  height: 100%;
  background-color: #f2e4e2;
  border-right: 1px solid #ccc;
  overflow: hidden;
  transition: width 0.3s ease;
}

.sidebar.collapsed {
  width: 80px;
}

.menu {
  display: flex;
  flex-direction: column;
}

.menu a {
  color: #ab1f1f;
  padding: 17px 25px;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 20px;
  font-weight: bold;
  font-size: 1.2rem;
  transition: background 0.3s, color 0.3s;
  border-bottom: 1px solid #ddd;
}

.menu a i {
  width: 25px;
  text-align: center;
}

.menu a:hover {
  background-color: #f34a4a;
  color: #fff;
}

/* ===== MAIN CONTENT / IFRAME ===== */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.content-frame {
  width: 100%;
  height: 100%;
  border: none;
}
</style>
<body>

  <!-- ===== TOP NAVBAR ===== -->
  <header class="navbar">
    <div class="navbar-left">
      <button id="toggleSidebar"><i class="fa-solid fa-bars"></i></button>
      <i class="fa-solid fa-film"></i>
      <span class="navbar-title">MoviEase</span>
    </div>
    <h2 class="navbar-center">ADMIN DASHBOARD</h2>
    <div class="navbar-right">
      <i class="fa-solid fa-gear"></i>
      <img src="profile.jpg" alt="Admin" class="profile-pic">
    </div>
  </header>

  <!-- ===== MAIN CONTAINER ===== -->
  <div class="container">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
      <nav class="menu">
        <a href="dashboard.html" target="content-frame"><i class="fa-solid fa-gauge"></i> <span>Dashboard</span></a>
        <a href="UsersPage.html" target="content-frame"><i class="fa-solid fa-users"></i> <span>Users</span></a>
        <a href="cinemas.html" target="content-frame"><i class="fa-solid fa-building"></i> <span>Cinemas</span></a>
        <a href="MoviesPageA.html" target="content-frame"><i class="fa-solid fa-film"></i> <span>Movies</span></a>
        <a href="schedule.html" target="content-frame"><i class="fa-solid fa-calendar-days"></i> <span>Calendar</span></a>
        <a href="seats.html" target="content-frame"><i class="fa-solid fa-chair"></i> <span>Seats</span></a>
        <a href="reports.html" target="content-frame"><i class="fa-solid fa-chart-line"></i> <span>Reports</span></a>
      </nav>
    </aside>

    <!-- ===== MAIN CONTENT AREA (IFRAME) ===== -->
    <main class="main-content">
      <iframe name="content-frame" src="dashboard.html" frameborder="0" class="content-frame"></iframe>
    </main>

  </div>

  <!-- ===== JS FOR SIDEBAR TOGGLE ===== -->
  <script>
    const toggleButton = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');
    const menuLinks = sidebar.querySelectorAll('.menu a span');

    toggleButton.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');

      // hide or show the text labels
      menuLinks.forEach(span => {
        span.style.display = sidebar.classList.contains('collapsed') ? 'none' : 'inline';
      });
    });
  </script>

</body>
</html>
