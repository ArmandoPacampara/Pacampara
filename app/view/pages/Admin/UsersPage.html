<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users & Roles | Moviease</title>
    <link rel="stylesheet" href="../public/styles/css/UsersPage.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="content-container">
      <!-- Header -->
      <header class="page-header">
        <div class="logo-section">
          <i class="fa-solid fa-clapperboard"></i>
          <h1>Moviease</h1>
        </div>
        <div class="filter">
          <select>
            <option>Show All</option>
            <option>Admins</option>
            <option>Customers</option>
          </select>
        </div>
      </header>

      <!-- USERS TABLE -->
      <section class="table-section">
        <div class="table-header">
          <h2>USERS</h2>
          <button class="add-btn"><i class="fa-solid fa-plus"></i></button>
        </div>

        <div class="table-wrapper">
          <table id="usersTable">
            <thead>
              <tr>
                <th>Delete</th>
                <th>User ID</th>
                <th>Role</th>
                <th>Name</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody>
              <!-- Rows will be dynamically inserted -->
            </tbody>
          </table>
          <p id="noUsers" class="empty-message">No users available</p>
        </div>
      </section>

      <!-- ROLES TABLE -->
      <section class="table-section">
        <div class="table-header">
          <h2>ROLES</h2>
          <button class="add-btn"><i class="fa-solid fa-plus"></i></button>
        </div>

        <div class="table-wrapper">
          <table id="rolesTable">
            <thead>
              <tr>
                <th>Delete</th>
                <th>Role ID</th>
                <th>User Role</th>
              </tr>
            </thead>
            <tbody>
              <!-- Rows will be dynamically inserted -->
            </tbody>
          </table>
          <p id="noRoles" class="empty-message">No roles available</p>
        </div>
      </section>
    </div>

    <script>
      // Example dynamic data (replace with backend or DB data later)
      const users = [
        { id: 1, role: "Admin", name: "Armando", email: "mando@example.com" },
        { id: 2, role: "User", name: "Jestaly", email: "jetsaly@example.com" },
      ];

      const roles = [
        { id: 1, role: "Admin" },
        { id: 2, role: "User" },
      ];

      const usersTable = document.querySelector("#usersTable tbody");
      const rolesTable = document.querySelector("#rolesTable tbody");
      const noUsersMsg = document.getElementById("noUsers");
      const noRolesMsg = document.getElementById("noRoles");

      // Populate USERS table
      if (users.length > 0) {
        noUsersMsg.style.display = "none";
        users.forEach((user) => {
          const row = document.createElement("tr");
          row.innerHTML = `
          <td><i class="fa-solid fa-trash delete-btn"></i></td>
          <td>${user.id}</td>
          <td>${user.role}</td>
          <td>${user.name}</td>
          <td>${user.email}</td>
        `;
          usersTable.appendChild(row);
        });
      }

      // Populate ROLES table
      if (roles.length > 0) {
        noRolesMsg.style.display = "none";
        roles.forEach((role) => {
          const row = document.createElement("tr");
          row.innerHTML = `
          <td><i class="fa-solid fa-trash delete-btn"></i></td>
          <td>${role.id}</td>
          <td>${role.role}</td>
        `;
          rolesTable.appendChild(row);
        });
      }
    </script>
  </body>
</html>
