<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Staff Notifications</title>
    <link rel="stylesheet" href="../../../../public/styles/css/StaffNotificationPage.css" />
</head>
<body>


<div class="notif-page">
    <h2 class="notif-title">Booking Notifications</h2>


    <div class="notif-list" id="notifList">


        <!-- Sample Unread -->
        <div class="notif-item unread" data-id="1">
            <div class="notif-left">
                <input type="checkbox" class="check" />
                <span class="star">&#9734;</span>
                <span class="notif-label">Booking • Juan Dela Cruz</span>
                <span class="notif-text">Inside Out 2 — Booking request for Dec 1, 6:00 PM • 2 seats</span>
            </div>
            <div class="notif-date">6:14 AM</div>
        </div>


        <!-- Sample Unread -->
        <div class="notif-item unread" data-id="2">
            <div class="notif-left">
                <input type="checkbox" class="check" />
                <span class="star">&#9734;</span>
                <span class="notif-label">Booking • Maria Santos</span>
                <span class="notif-text">Dune Part Two — Ticket reservation (1 seat)</span>
            </div>
            <div class="notif-date">Yesterday</div>
        </div>


        <!-- Sample Read -->
        <div class="notif-item" data-id="3">
            <div class="notif-left">
                <input type="checkbox" class="check" />
                <span class="star">&#9734;</span>
                <span class="notif-label">Booking • Carlo Fernandez</span>
                <span class="notif-text">Avengers Endgame — Booking completed</span>
            </div>
            <div class="notif-date">Nov 25</div>
        </div>


    </div>
</div>


<!-- 📌 Popup Modal When Opening Notification -->
<div class="notif-modal" id="notifModal">
    <div class="modal-box">
        <div class="popup-header">
            <span id="modalTitle" class="popup-title">Notification</span>
            <button class="popup-close-btn" aria-label="Close">&times;</button>
        </div>
        <div id="modalMessage" class="popup-content"></div>


        <div class="modal-actions">
            <button id="markReadBtn">Mark as Read</button>
            <button id="deleteBtn" class="delete">Delete</button>
        </div>
    </div>
</div>


<script>
    // ========== ELEMENTS ==========
    const notifItems = document.querySelectorAll(".notif-item");
    const modal = document.getElementById("notifModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalMessage = document.getElementById("modalMessage");
    const markReadBtn = document.getElementById("markReadBtn");
    const deleteBtn = document.getElementById("deleteBtn");


    let currentNotif = null; // Keeps track of the notification opened


    // Open Notification Popup
    notifItems.forEach(item => {
        item.addEventListener("click", (e) => {
            // Avoid triggering when clicking checkbox or star
            if (e.target.classList.contains("check") || e.target.classList.contains("star")) return;


            currentNotif = item;


            // Fill modal
            modalTitle.textContent = item.querySelector(".notif-label").textContent;
            modalMessage.textContent = item.querySelector(".notif-text").textContent;


            modal.classList.add("active");
        });
    });


    // Star / Unstar
    document.querySelectorAll(".star").forEach(star => {
        star.addEventListener("click", (e) => {
            e.stopPropagation(); // Prevent opening the modal
            star.classList.toggle("starred");
            star.innerHTML = star.classList.contains("starred") ? "★" : "☆";
        });
    });


    // Mark as Read
    markReadBtn.addEventListener("click", () => {
        if (currentNotif) {
            currentNotif.classList.remove("unread");
        }
        closeModal();
    });


    // Delete Notification
    deleteBtn.addEventListener("click", () => {
        if (currentNotif) {
            currentNotif.remove();
        }
        closeModal();
    });


    // Close modal helper function
    function closeModal() {
        modal.classList.remove("active");
        currentNotif = null;
    }


    // Close modal on close button click
    document.querySelector(".popup-close-btn").addEventListener("click", closeModal);


    // Close modal on background click
    modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
    });
</script>


</body>
</html>
