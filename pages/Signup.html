// Function to update the dots indicator
function updateDots() {
  const dots = document.querySelectorAll('.dots span');
  dots.forEach((dot, index) => {
    if (index + 1 === currentStep) {
      dot.style.opacity = '1';
    } else {
      dot.style.opacity = '0.6';
    }
  });
}

// Function to update button
function updateButton() {
  const buttonContainer = document.querySelector('.button-container');
  
  if (currentStep === 1) {
    buttonContainer.innerHTML = '<button type="button" class="next-btn" onclick="goToStep2()">NEXT</button>';
  } else {
    buttonContainer.innerHTML = `
      <button type="button" class="back-btn" onclick="goToStep1()">BACK</button>
      <button type="submit" class="signup-btn">SIGN UP</button>
    `;
  }
}

// Function to transition to step 2
function goToStep2() {
  const container2 = document.querySelector('.container2');
  
  // Add fade out effect
  container2.style.opacity = '0';
  container2.style.transform = 'translateX(-20px)';
  
  setTimeout(() => {
    container2.innerHTML = step2Content;
    currentStep = 2;
    updateDots();
    updateButton();
    
    // Add fade in effect
    setTimeout(() => {
      container2.style.opacity = '1';
      container2.style.transform = 'translateX(0)';
    }, 50);
  }, 300);
}
