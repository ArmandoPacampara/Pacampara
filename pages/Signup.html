<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoviEase Signup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #a31212;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }

    .poster-container {
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      width: 380px;
      height: 520px;
      margin-right: -260px;
      position: relative;
      transition: transform 0.3s ease;
    }

    .poster-container:hover {
      transform: translateY(-8px);
    }

    .poster-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
    }

    .container {
      position: unset;
      background-color: #fff;
      border-radius: 25px;
      height: 609px;
      width: 920px;
      padding: 80px;
      padding-left: 280px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .icon {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
    }

    .icon i {
      font-size: 60px;
      color: #a31212;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      width: 20px;
      height: 20px;
      pointer-events: none;
    }

    .input-group input {
      width: 80%;
      padding: 12px 12px 12px 40px; 
      border: 1px solid #a31212;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
      transition: border 0.3s;
    }

    .input-group input:focus {
      border-color: #870e0e;
    }

    .next-btn {
      width: 120px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #a31212;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      display: block;
      margin: 20px auto 0;
    }

    .next-btn:hover {
      background-color: #870e0e;
    }

    .dots {
      display: flex;
      justify-content: center;
      margin-top: 10px;
      color: #a31212;
    }

    .dots span {
      height: 8px;
      width: 8px;
      background-color: #a31212;
      border-radius: 50%;
      display: inline-block;
      margin: 0 4px;
    }

    .dots span:nth-child(2) {
      opacity: 0.6;
    }

    @media (max-width: 900px) {
      .wrapper {
        flex-direction: column;
        gap: 20px;
      }

      .poster-container {
        width: 70%;
        height: 300px;
      }

      .container {
        width: 80%;
        padding-left: 40px;
      }
    }

        .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }
        .logo h1 {
      color: #a31212;
      font-size: 26px;
      font-weight: 700;
    }

    .icon {
      width: 40px;
    }

        .logo img {
      width: 40px;
      margin-right: 10px;
    }
        .container2 {
      display: flex;
      flex-direction: column;
      padding-top: 30px;
      padding-left: 100px;
    }
    .button-container {
      display: flex;
      justify-content: right;
      margin-top: 10px;
      padding-left: 260px;
    }
  </style>

  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="wrapper">
    <div class="poster-container">
      <img src="https://cdn.myanimelist.net/images/anime/1806/126216.jpg" alt="Chainsaw Man Poster">
    </div>

    <div class="container">
      <div class="logo">
        <img src="../assets/MoviEase_logo (2).png" alt="logo">
        <h1>MoviEase</h1>
      </div>

      <form>
        <center>
          <div class="container2">
          <div class="input-group">
            <img src="../assets/profile_icon.png" alt="profile_icon" class="input-icon">
            <input type="text" placeholder="Name" required name="name">
          </div>

          <div class="input-group">
            <img src="../assets/location_icon.png" alt="profile_icon" class="input-icon">
            <input type="text" placeholder="Province/Municipality/Country" required name="province">
          </div>

          <div class="input-group">
            <img src="../assets/location_icon.png" alt="profile_icon" class="input-icon">
            <input type="text" placeholder="Subdivision/Street/Barangay" required name="address">
          </div>

          <div class="input-group">
            <img src="../assets/location_icon.png" alt="location_icon" class="input-icon">
            <input type="text" placeholder="City" required name="city">
          </div>

          <div class="input-group">
            <img src="../assets/phone_icon.png" alt="profile_icon" class="input-icon">
            <input type="text" placeholder="Phone Number" required name="phone-number">
          </div>
        </div>

          <div class="dots">
            <span></span>
            <span></span>
          </div>
          <div class="button-container">
          <button type="submit" class="next-btn">NEXT</button>
          </div>
        </center>
      </form>
    </div>
  </div>

</body>
</html>
