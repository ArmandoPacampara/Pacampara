<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoviEase Signup</title>
<link rel="stylesheet" href="/styles/Signup.css">

  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="wrapper">
    <div class="poster-container">
      <img src="https://cdn.myanimelist.net/images/anime/1806/126216.jpg" alt="Chainsaw Man Poster">
    </div>

    <div class="container">
      <div class="logo">
        <img src="../assets/MoviEase_logo (2).png" alt="logo">
        <h1>MoviEase</h1>
      </div>

      <form>
        <center>
          <div class="container2">
          <div class="input-group">
            <img src="../assets/profile_icon.png" alt="profile_icon" class="input-icon">
            <input type="text" placeholder="Name" required name="name">
          </div>

          <div class="input-group">
            <img src="../assets/location_icon.png" alt="profile_icon" class="input-icon">
            <input type="text" placeholder="Province/Municipality/Country"  name="province">
          </div>

          <div class="input-group">
            <img src="../assets/location_icon.png" alt="profile_icon" class="input-icon">
            <input type="text" placeholder="Subdivision/Street/Barangay" required name="address">
          </div>

          <div class="input-group">
            <img src="../assets/location_icon.png" alt="location_icon" class="input-icon">
            <input type="text" placeholder="City" required name="city">
          </div>

          <div class="input-group">
            <img src="../assets/phone_icon.png" alt="profile_icon" class="input-icon">
            <input type="text" placeholder="Phone Number" required name="phone-number">
          </div>
        </div>

          <div class="dots">
            <span></span>
            <span></span>
          </div>
          <div class="button-container">
          <button type="submit" class="next-btn">NEXT</button>
          </div>
        </center>
      </form>
    </div>
  </div>

<script>
// Multi-step form functionality for MoviEase signup
let currentStep = 1;

// Step 1 content (original)
const step1Content = `
  <div class="input-group">
    <img src="../assets/profile_icon.png" alt="profile_icon" class="input-icon">
    <input type="text" placeholder="Name" required name="name">
  </div>

  <div class="input-group">
    <img src="../assets/location_icon.png" alt="location_icon" class="input-icon">
    <input type="text" placeholder="Province/Municipality/Country" name="province">
  </div>

  <div class="input-group">
    <img src="../assets/location_icon.png" alt="location_icon" class="input-icon">
    <input type="text" placeholder="Subdivision/Street/Barangay" required name="address">
  </div>

  <div class="input-group">
    <img src="../assets/location_icon.png" alt="location_icon" class="input-icon">
    <input type="text" placeholder="City" required name="city">
  </div>

  <div class="input-group">
    <img src="../assets/phone_icon.png" alt="phone_icon" class="input-icon">
    <input type="text" placeholder="Phone Number" required name="phone-number">
  </div>
`;

// Step 2 content (new)
const step2Content = `
  <div class="genre-group">
    <label class="genre-label">Choose Your Favorite Genres:</label>
    <div class="checkbox-container">
      <label class="checkbox-label">
        <input type="checkbox" name="genre" value="Action"> Action
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="genre" value="Adventure"> Adventure
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="genre" value="Comedy"> Comedy
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="genre" value="Drama"> Drama
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="genre" value="Horror"> Horror
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="genre" value="Romance"> Romance
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="genre" value="Sci-Fi"> Sci-Fi
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="genre" value="Fantasy"> Fantasy
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="genre" value="Thriller"> Thriller
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="genre" value="Animation"> Animation
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="genre" value="Documentary"> Documentary
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="genre" value="Musical"> Musical
      </label>
    </div>
  </div>

  <div class="input-group">
    <img src="../assets/profile_icon.png" alt="profile_icon" class="input-icon">
    <input type="email" placeholder="Email" required name="email">
  </div>

  <div class="input-group">
    <img src="../assets/lock_icon.png" alt="lock_icon" class="input-icon">
    <input type="password" placeholder="Password" required name="password">
  </div>

  <div class="input-group">
    <img src="../assets/lock_icon.png" alt="lock_icon" class="input-icon">
    <input type="password" placeholder="Confirm Password" required name="confirm_password">
  </div>
`;

// Function to update the dots indicator
function updateDots() {
  const dots = document.querySelectorAll('.dots span');
  dots.forEach((dot, index) => {
    if (index + 1 === currentStep) {
      dot.style.opacity = '1';
    } else {
      dot.style.opacity = '0.6';
    }
  });
}

// Function to update button
function updateButton() {
  const buttonContainer = document.querySelector('.button-container');
  
  if (currentStep === 1) {
    buttonContainer.innerHTML = '<button type="button" class="next-btn" onclick="goToStep2()">NEXT</button>';
  } else {
    buttonContainer.innerHTML = `
      <button type="button" class="back-btn" onclick="goToStep1()">BACK</button>
      <button type="submit" class="signup-btn">SIGN UP</button>
    `;
  }
}

// Function to transition to step 2
function goToStep2() {
  const container2 = document.querySelector('.container2');
  
  // Add fade out effect
  container2.style.opacity = '0';
  container2.style.transform = 'translateX(-20px)';
  
  setTimeout(() => {
    container2.innerHTML = step2Content;
    currentStep = 2;
    updateDots();
    updateButton();
    
    // Add fade in effect
    setTimeout(() => {
      container2.style.opacity = '1';
      container2.style.transform = 'translateX(0)';
    }, 50);
  }, 300);
}

// Function to go back to step 1
function goToStep1() {
  const container2 = document.querySelector('.container2');
  
  // Add fade out effect
  container2.style.opacity = '0';
  container2.style.transform = 'translateX(20px)';
  
  setTimeout(() => {
    container2.innerHTML = step1Content;
    currentStep = 1;
    updateDots();
    updateButton();
    
    // Add fade in effect
    setTimeout(() => {
      container2.style.opacity = '1';
      container2.style.transform = 'translateX(0)';
    }, 50);
  }, 300);
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
  // Add transition styles to container2
  const container2 = document.querySelector('.container2');
  container2.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
  
  // Update initial button
  updateButton();
  updateDots();
});
</script>

</body>
</html>
