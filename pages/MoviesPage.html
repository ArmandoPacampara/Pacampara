<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoviEase</title>
  <link rel="stylesheet" href="../styles/MoviePage.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <div class="nav-holder">
    <nav class="navbar">
      <div class="nav-left">
        <img src="../assets/logo.jpg" alt="Logo" class="logo">
        <span class="site-name">MoviEase</span>
      </div>
      <div class="nav-links">
        <a href="#">MOVIES</a>
        <a href="#">SCHEDULE</a>
        <a href="#">CINEMAS</a>
      </div>
      <div class="nav-right">
        <select class="cinema-dropdown">
          <option>Choose a cinema</option>
          <option>SM Cinema</option>
          <option>Robinsons</option>
          <option>Ayala Malls</option>
        </select>
        <img src="../assets/account_icon.png" alt="Account" class="account-icon">
      </div>
    </nav>
  </div>

  <!-- Now Showing Section -->
  <section class="movie-section">
    <h2 class="section-title">NOW SHOWING</h2>
    <div class="movie-container">
      <div class="movie-card">
        <img src="../assets/quezon.jpg" alt="QUEZON">
        <p>QUEZON</p>
      </div>
      <div class="movie-card">
        <img src="../assets/blackphone2.jpg" alt="BLACK PHONE 2">
        <p>BLACK PHONE 2</p>
      </div>
      <div class="movie-card">
        <img src="../assets/goodboy.jpg" alt="GOOD BOY">
        <p>GOOD BOY</p>
      </div>
      <div class="movie-card">
        <img src="../assets/roofman.jpg" alt="ROOFMAN">
        <p>ROOFMAN</p>
      </div>
      <div class="movie-card">
        <img src="../assets/tronares.jpg" alt="TRON ARES">
        <p>TRON ARES</p>
      </div>
    </div>
    <button class="show-more">Show More</button>
  </section>

  <!-- Coming Soon Section -->
  <section class="movie-section coming-soon">
    <h2 class="section-title">COMING SOON</h2>
    <div class="movie-container">
      <div class="movie-card">
        <img src="../assets/chainsawman.jpg" alt="CHAINSAW MAN REZE ARC">
        <p>CHAINSAW MAN REZE ARC</p>
      </div>
      <div class="movie-card">
        <img src="../assets/tronares.jpg" alt="TRON ARES">
        <p>TRON ARES</p>
      </div>
      <div class="movie-card">
        <img src="../assets/minamahal.jpg" alt="MINAMAHAL">
        <p>MINAMAHAL</p>
      </div>
      <div class="movie-card">
        <img src="../assets/roofman.jpg" alt="ROOFMAN">
        <p>ROOFMAN</p>
      </div>
      <div class="movie-card">
        <img src="../assets/zootopia2.jpg" alt="ZOOTOPIA 2">
        <p>ZOOTOPIA 2</p>
      </div>
    </div>
    <button class="show-more">Show More</button>
  </section>

</body>
</html>
